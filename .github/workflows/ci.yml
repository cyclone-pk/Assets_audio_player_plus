name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Resolve dependencies (plugin)
        run: flutter pub get

      - name: Resolve dependencies (web package)
        working-directory: assets_audio_player_plus_web
        run: flutter pub get

      - name: Resolve dependencies (example)
        working-directory: example
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze plugin
        run: flutter analyze

      - name: Analyze web package
        working-directory: assets_audio_player_plus_web
        run: flutter analyze

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

  build-web:
    name: Build example (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: example
        run: flutter pub get
      - name: Build JS (release)
        working-directory: example
        run: flutter build web --release
      - name: Build WASM
        working-directory: example
        run: flutter build web --wasm

  build-android:
    name: Build example (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: example
        run: flutter pub get
      - name: Build APK (debug)
        working-directory: example
        run: flutter build apk --debug
